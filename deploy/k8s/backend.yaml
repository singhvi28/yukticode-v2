apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: yukti-code
  labels:
    app: backend
    app.kubernetes.io/name: yukti-backend
    app.kubernetes.io/part-of: online-judge
spec:
  ports:
    - port: 9000
      name: http
      targetPort: 9000
  selector:
    app: backend
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: yukti-code
  labels:
    app: backend
    app.kubernetes.io/name: yukti-backend
    app.kubernetes.io/part-of: online-judge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: yukti-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U judge; do
                echo "Waiting for postgres to become reachable...";
                sleep 2;
              done;
          env:
            - name: PGCONNECT_TIMEOUT
              value: "3"
      containers:
        - name: backend
          image: cf-clone-v2-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE_MINUTES
              value: "60"
            - name: ADMIN_USERNAME
              value: "admin"
            - name: ADMIN_EMAIL
              value: "admin@example.local"
            - name: ADMIN_PASSWORD
              value: "AdminPass123!"
            - name: CORS_ORIGINS
              value: "http://localhost:8080,http://localhost:5173,http://localhost:30080"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
