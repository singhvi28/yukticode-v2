apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: yukti-code
  labels:
    app: frontend
    app.kubernetes.io/name: yukti-frontend
    app.kubernetes.io/part-of: online-judge
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: yukti-code
  labels:
    app: frontend
    app.kubernetes.io/name: yukti-frontend
    app.kubernetes.io/part-of: online-judge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: yukti-frontend
    spec:
      containers:
        - name: frontend
          image: cf-clone-v2-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
