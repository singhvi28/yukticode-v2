##############################################################################
# Nginx config for YuktiCode — reverse-proxies the REST API and serves the SPA.
#
# Request routing:
#   /api/*      → upstream FastAPI (strips /api prefix)
#   everything  → index.html  (React SPA client-side routing)
##############################################################################

upstream backend {
    server backend:9000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # Largest legitimate request is a 20-test batch: 20 × 64 KiB test text
    # plus a 256 KiB source. JSON escaping can multiply control characters,
    # so leave generous headroom; Pydantic still enforces the real limits.
    client_max_body_size 16m;

    # ─── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    root  /usr/share/nginx/html;
    index index.html;

    # ─── Static assets with long cache ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ─── Backend REST API  (/api/* → FastAPI, prefix stripped) ─────────────
    location /api/ {
        proxy_pass         http://backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── SPA fallback — all other paths serve index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection      "1; mode=block" always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    }

    # ─── Health check ───────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
